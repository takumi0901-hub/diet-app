name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f logic.js
          test -f sheets.js
          test -f manifest.json
          test -f sw.js

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check logic.js
          node --check sheets.js
          node --check sw.js

  deploy:
    name: deploy
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir _site
          cp index.html style.css app.js logic.js sheets.js manifest.json sw.js _site/
          cp -r icons _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4